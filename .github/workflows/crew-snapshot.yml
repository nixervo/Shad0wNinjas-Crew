name: Crew Snapshot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: \${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install openpyxl

      - run: python crew_snapshot.py --once

      - run: git config user.name "Crew-bot" && git config user.email "bot@crew.local" && git add -A && git commit -m "auto: history regen" --allow-empty && git push
